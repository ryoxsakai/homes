name = "homes-auth"
main = "worker/index.mjs"
compatibility_date = "2026-11-23"
workers_dev = true
preview_urls = false
keep_vars = true

[[durable_objects.bindings]]
name = "AUTH_STORE"
class_name = "HomesAuthStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["HomesAuthStore"]

[[durable_objects.bindings]]
name = "HOME_STORE"
class_name = "HomesDataStore"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["HomesDataStore"]

[[rules]]
type = "Text"
globs = ["**/ui/app.html", "**/ui/app.css", "**/ui/app.mjs"]
fallthrough = true

[[rules]]
type = "Data"
globs = ["**/ui/Homes.png"]
fallthrough = true

[[routes]]
pattern = "homes.lrnr.jp"
custom_domain = true
