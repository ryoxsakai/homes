name = "homes-auth"
main = "worker/index.mjs"
compatibility_date = "2026-11-23"
workers_dev = true
preview_urls = false
keep_vars = true

[[durable_objects.bindings]]
name = "AUTH_STORE"
class_name = "HomesAuthStore"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["HomesAuthStore"]

[[durable_objects.bindings]]
name = "HOME_STORE"
class_name = "HomesDataStore"

[[migrations]]
tag = "v2"
new_sqlite_classes = ["HomesDataStore"]

[[rules]]
type = "Data"
globs = ["**/ui/Homes.png"]
fallthrough = true

# Works-derived ToDo/Memo screens. run_worker_first keeps every file behind the
# Worker's sign-in check; nothing in public/ is served without a family session.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = true
html_handling = "auto-trailing-slash"
not_found_handling = "none"

[[routes]]
pattern = "homes.lrnr.jp"
custom_domain = true
