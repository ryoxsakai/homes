<script>try{document.documentElement.dataset.theme=localStorage.getItem('homes.design.theme')==='dark'?'dark':'light'}catch{}</script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=M+PLUS+2:wght@300;400;500;700;800&amp;display=swap">
<style>
:root{font:14px/1.6 "M PLUS 2","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;color-scheme:light;--page:#f6f1ea;--surface:#fffcf8;--side:#eee5da;--track:#f0e7dd;--line:#e8ded2;--border:#a5806c;--ink:#2c211c;--muted:#684f40;--accent:#984324;--soft:#fae7db;--red:#a32536;--red-bg:#fce8e9;--green:#275d42;--green-bg:#e5f1e8;--contrast:#fff;--shadow:0 1px 2px #3a221418,0 4px 12px #3a22140d;--float:0 2px 6px #3a221426,0 12px 32px #3a221421;--gradient:linear-gradient(135deg,#9b421d,#963e33);--gutter:clamp(16px,2vw,28px);--nav:240px}
:root[data-theme=dark]{color-scheme:dark;--page:#1f1916;--surface:#2b231f;--side:#25201c;--track:#3a3029;--line:#463a32;--border:#a08675;--ink:#fff1e5;--muted:#d1b6a3;--accent:#ffae8f;--soft:#493128;--red:#ffb7bf;--red-bg:#482832;--green:#a8dec0;--green-bg:#294036;--contrast:#261b15;--shadow:0 1px 2px #0006,0 4px 12px #0003;--float:0 2px 6px #0008,0 12px 32px #0005}
*,*::before,*::after{box-sizing:border-box} body{margin:0;background:var(--page);color:var(--ink);min-height:100dvh} [hidden]{display:none!important} svg{display:block;width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.65;stroke-linecap:round;stroke-linejoin:round;flex:none} button,a{font:inherit;color:inherit} button{border:0;background:none;cursor:pointer;padding:0} a{text-decoration:none} button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:3px} .skip{position:fixed;top:5px;left:5px;transform:translateY(-130%);z-index:100;background:var(--surface);padding:10px}.skip:focus{transform:none}
header{height:60px;position:sticky;top:0;z-index:5;display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--surface);border-bottom:1px solid var(--line);padding:0 var(--gutter)} .brand,.actions{display:flex;align-items:center;gap:8px}.brand strong{font-weight:800;font-size:1.14rem;letter-spacing:-.025em}.mark{width:30px;height:30px;border-radius:8px;background:var(--soft);color:var(--accent);display:grid;place-items:center}.icon-btn{width:44px;height:44px;flex:none;display:grid;place-items:center;border-radius:8px;color:var(--muted)} .icon-btn:hover,.icon-btn[aria-expanded=true]{background:var(--track);color:var(--ink)} .avatar{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--soft);color:var(--accent);font-weight:800;font-size:.85rem}
.primary{min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 16px;border-radius:999px;color:#fff;background:var(--gradient);font-weight:700;white-space:nowrap}.primary:hover{filter:brightness(1.08)} .quick{position:relative}.popup{position:absolute;top:calc(100% + 8px);right:0;min-width:180px;padding:6px;border-radius:8px;background:var(--surface);box-shadow:var(--float);border:1px solid var(--line);z-index:7}.popup button{display:flex;width:100%;align-items:center;gap:10px;text-align:left;padding:0 10px;min-height:44px;border-radius:6px}.popup button:hover{background:var(--track)}
.side{position:fixed;inset:60px auto 0 0;width:var(--nav);background:var(--side);padding:22px 14px;z-index:4;overflow:auto}.side h2{color:var(--muted);padding:0 10px;margin:0 0 8px;font-size:.77rem;letter-spacing:.06em}.side a{min-height:44px;display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:8px;color:var(--muted);font-weight:500}.side a[aria-current=page]{background:var(--surface);box-shadow:var(--shadow);color:var(--ink);font-weight:700}.side a:hover{background:var(--surface)} .app-icon{display:grid;place-items:center;width:28px;height:28px;border-radius:7px;background:var(--soft);color:var(--accent)}.app-icon svg{width:17px;height:17px}.app-icon[data-service=calendar]{background:var(--green-bg);color:var(--green)}.app-icon[data-service=notes]{background:var(--track);color:var(--muted)}
main{margin-left:var(--nav);padding:26px var(--gutter) 36px;min-width:0}.eyebrow{color:var(--muted);font-size:.71rem;letter-spacing:.14em;font-weight:700;margin:0} h1{font-size:20px;margin:1px 0 0;line-height:1.4} h2,p{margin-top:0}.intro{display:flex;align-items:end;justify-content:space-between;gap:12px;margin-bottom:18px}.sample{padding:3px 9px;border-radius:999px;background:var(--track);color:var(--muted);font-size:.82rem;white-space:nowrap}.tabs{display:inline-flex;background:var(--track);padding:4px;border-radius:8px;gap:3px;margin-bottom:16px}.tabs button{min-height:36px;padding:0 15px;border-radius:6px;font-weight:500;color:var(--muted)}.tabs button[aria-selected=true]{background:var(--surface);color:var(--ink);font-weight:700;box-shadow:var(--shadow)} .tabs button:hover{color:var(--ink)}
.grid{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(245px,1fr);align-items:start;gap:16px}.col{display:grid;gap:16px;min-width:0}.card{background:var(--surface);box-shadow:var(--shadow);border-radius:8px;min-width:0}.card-head{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:11px 16px 8px;min-height:57px}.card-head h2{font-size:1rem;margin:0;font-weight:800}.card-head p{font-size:.8rem;color:var(--muted);margin:0}.row{display:flex;align-items:center;gap:12px;min-height:60px;padding:8px 16px;border-top:1px solid var(--line)}.row-text{min-width:0;flex:1}.row-title{display:block;color:var(--ink);font-weight:700;overflow-wrap:anywhere}.caption{display:block;color:var(--muted);font-size:.82rem}.check{height:44px;width:44px;display:grid;place-items:center;flex:none;margin-left:-10px;margin-right:-5px;border-radius:8px}.check span{width:20px;height:20px;border:1.5px solid var(--border);border-radius:50%;display:grid;place-items:center;color:var(--contrast)}.check svg{width:13px;height:13px}.check[aria-pressed=true] span{background:var(--accent);border-color:var(--accent);color:var(--contrast)}.check:hover{background:var(--track)} .check[aria-pressed=true]+.row-text .row-title{color:var(--muted);text-decoration:line-through}.chip{flex:none;border-radius:999px;padding:3px 9px;background:var(--soft);color:var(--accent);font-size:.82rem;white-space:nowrap}.chip.red{background:var(--red-bg);color:var(--red)}.chip.green{background:var(--green-bg);color:var(--green)}
.notice{padding:14px 16px;color:var(--muted);font-size:.86rem;margin:0}.notice strong{display:block;color:var(--ink);font-size:.9rem}.empty{padding:18px 16px;border-top:1px solid var(--line);color:var(--muted);margin:0}.mobile-toggle,.screenbar,.scrim{display:none}
dialog{width:min(calc(100vw - 32px),430px);border:0;border-radius:12px;padding:0;background:var(--surface);color:var(--ink);box-shadow:var(--float)}dialog::backdrop{background:#22130fb3}.dlg-head,.dlg-foot{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);gap:12px}.dlg-foot{border:0;border-top:1px solid var(--line);justify-content:flex-end}.dlg-head h2{margin:0;font-size:1rem}.dlg-main{padding:16px}.dlg-main p{color:var(--muted);margin:0}.dlg-main label{display:block;margin:0 0 4px;font-weight:700}.dlg-main input{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:10px}.secondary{min-height:44px;border-radius:8px;padding:0 13px;background:var(--track);color:var(--ink);font-weight:700}.toast{position:fixed;right:var(--gutter);bottom:16px;background:var(--ink);color:var(--contrast);padding:10px 14px;box-shadow:var(--float);border-radius:8px;z-index:4}
@media(max-width:1023px){.mobile-toggle{display:grid;margin-left:-8px}.side{transform:translateX(-110%);visibility:hidden;transition:transform .18s ease;box-shadow:var(--float)} .side.open{transform:none;visibility:visible}.scrim.visible{display:block;position:fixed;inset:60px 0 0;background:#24191069;z-index:3}.scrim.visible[hidden]{display:none}main{margin-left:0}}
@media(max-width:640px){header{padding:0 12px}.actions{gap:0}.brand{gap:4px}.primary{padding:0 12px}.quick .primary svg{width:17px;height:17px}main{padding:20px 0 calc(100px + env(safe-area-inset-bottom));}h1{font-size:18px}.intro{margin:0 16px 14px}.tabs{margin-left:16px}.grid{display:block}.col{gap:12px}.col+.col{margin:12px 16px 0}.list-card{border-radius:0;box-shadow:none}.card-head{padding-left:16px}.row{padding-left:16px;padding-right:16px}.screenbar{display:flex;align-items:center;gap:5px;position:fixed;z-index:2;bottom:calc(12px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);border-radius:999px;padding:5px;background:var(--surface);box-shadow:var(--float);border:1px solid var(--line)}.screenbar button{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--muted)}.screenbar button[aria-pressed=true]{color:var(--contrast);background:var(--ink)}.toast{bottom:calc(80px + env(safe-area-inset-bottom))}}
@media(max-width:365px){.quick-label{display:none}.quick .primary{width:44px;padding:0}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{scroll-behavior:auto!important;animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style></head><body>
<a class="skip" href="#main">本文へ</a>
<header><div class="brand"><button class="icon-btn mobile-toggle" id="menu-button" aria-label="サービスメニュー" aria-controls="side" aria-expanded="false" data-icon="menu"></button><span class="mark" data-icon="home"></span><strong>Homes</strong></div>
<div class="actions"><button class="icon-btn" id="settings" aria-label="外観設定" title="外観設定" data-icon="settings"></button><button class="icon-btn" id="account" aria-label="アカウント" title="アカウント"><span class="avatar" aria-hidden="true">H</span></button><div class="quick"><button class="primary" id="quick" aria-label="クイック追加" aria-controls="quick-menu" aria-expanded="false"><span data-icon="plus"></span><span class="quick-label">追加</span></button><div id="quick-menu" class="popup" hidden><button data-create="todo"><span data-icon="todo"></span>ToDoを追加</button><button data-create="notes"><span data-icon="notes"></span>メモを追加</button></div></div></div></header>
<aside class="side" id="side"><h2>サービス</h2><nav id="services" aria-label="サービス"></nav></aside><button class="scrim" id="scrim" aria-label="サービスメニューを閉じる" tabindex="-1" hidden></button>
<main id="main" tabindex="-1"><div class="intro"><div><p id="eyebrow" class="eyebrow"></p><h1 id="page-title"></h1></div><span class="sample">デザイン見本</span></div><div id="tabs" class="tabs" role="tablist" aria-label="ToDoの表示"></div><div class="grid"><section class="col" id="primary-content" aria-label="一覧"></section><aside class="col" id="secondary-content" aria-label="補足"></aside></div></main>
<nav class="screenbar" id="screenbar" aria-label="ToDoの表示切替"></nav><output class="toast" id="toast" role="status" hidden></output>
<dialog id="dialog" aria-labelledby="dialog-title"><form id="dialog-form"><div class="dlg-head"><h2 id="dialog-title"></h2><button class="icon-btn" id="dialog-close" type="button" aria-label="閉じる" data-icon="close"></button></div><div class="dlg-main" id="dialog-main"></div><div class="dlg-foot" id="dialog-foot"></div></form></dialog>
<script>
const icons={home:'<path d="m3 10 9-7 9 7v9a2 2 0 0 1-2 2h-4v-6H9v6H5a2 2 0 0 1-2-2z"/>',menu:'<path d="M4 6h16M4 12h16M4 18h16"/>',plus:'<path d="M12 5v14M5 12h14"/>',settings:'<path d="M4 7h16M4 12h16M4 17h16"/><circle cx="8" cy="7" r="2" fill="var(--surface)"/><circle cx="16" cy="12" r="2" fill="var(--surface)"/><circle cx="10" cy="17" r="2" fill="var(--surface)"/>',todo:'<path d="m3 6 1.5 1.5L7 5m3 1h11M3 12l1.5 1.5L7 11m3 1h11M3 18l1.5 1.5L7 17m3 1h11"/>',calendar:'<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4m8-4v4m-8 8h2m4 0h2"/>',notes:'<path d="M5 3h10l4 4v14H5zM15 3v5h4M8 12h8m-8 4h6"/>',inbox:'<path d="M4 4h16l2 11v5H2v-5zM2 15h6l2 2h4l2-2h6"/>',check:'<path d="m5 12 4 4L19 6"/>',close:'<path d="m6 6 12 12M18 6 6 18"/>',arrow:'<path d="m9 6 6 6-6 6"/>'};
const svg=k=>'<svg viewBox="0 0 24 24" aria-hidden="true">'+icons[k]+'</svg>';
const $=s=>document.querySelector(s), read=k=>{try{return localStorage.getItem('homes.design.'+k)}catch{return null}}, put=(k,v)=>{try{localStorage.setItem('homes.design.'+k,v)}catch{}};
const escapeText=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
for(const el of document.querySelectorAll('[data-icon]')) el.innerHTML=svg(el.dataset.icon);
const services={todo:['ToDo','TASKS'],calendar:['予定','CALENDAR'],notes:['メモ','NOTES']};
const tabs={upcoming:['近日予定','calendar'],inbox:['インボックス','inbox'],done:['完了済み','check']};
let service=Object.hasOwn(services,read('service'))?read('service'):'todo', tab=Object.hasOwn(tabs,read('todo-tab'))?read('todo-tab'):'upcoming', id=7, toastTimer;
const tasks=[{id:1,name:'電球の予備を買う',meta:'買い物',badge:'期限超過',tone:'red',bucket:'upcoming'},{id:2,name:'冷蔵庫の食材を確認する',meta:'家のこと',badge:'今日',tone:'',bucket:'upcoming'},{id:3,name:'図書館の本を返す',meta:'外出',badge:'明日',tone:'green',bucket:'upcoming'},{id:4,name:'電池の型番を調べる',meta:'買い物',badge:'未設定',tone:'',bucket:'inbox'},{id:5,name:'資源ごみをまとめる',meta:'家のこと',badge:'完了',tone:'green',bucket:'upcoming',done:true}];
const notes=['買い物メモ','収納の見直し'];
const schedule=[['図書館へ行く','土曜 10:00','外出'],['宅配便を受け取る','日曜 14:00','自宅']];
const card=(title,sub,body,add='',className='')=>'<article class="card '+className+'"><div class="card-head"><div><h2>'+title+'</h2>'+(sub?'<p>'+sub+'</p>':'')+'</div>'+(add?'<button class="icon-btn" data-create="'+add+'" aria-label="'+services[add][0]+'を追加" title="'+services[add][0]+'を追加">'+svg('plus')+'</button>':'')+'</div>'+body+'</article>';
const row=(name,meta,badge='',tone='')=>'<div class="row"><span class="row-text"><span class="row-title">'+escapeText(name)+'</span><span class="caption">'+escapeText(meta)+'</span></span>'+(badge?'<span class="chip '+tone+'">'+badge+'</span>':'')+'</div>';
function render(){
  $('#services').innerHTML=Object.entries(services).map(([k,[name]])=>'<a href="#'+k+'" '+(k===service?'aria-current="page" ':'')+'data-service-link="'+k+'"><span class="app-icon" data-service="'+k+'">'+svg(k)+'</span>'+name+'</a>').join('');
  $('#eyebrow').textContent=services[service][1];$('#page-title').textContent=services[service][0];
  $('#tabs').hidden=$('#screenbar').hidden=service!=='todo';
  $('#tabs').innerHTML=Object.entries(tabs).map(([k,[name]])=>'<button role="tab" id="tab-'+k+'" aria-controls="primary-content" aria-selected="'+(k===tab)+'" tabindex="'+(k===tab?'0':'-1')+'" data-view="'+k+'">'+name+'</button>').join('');
  $('#screenbar').innerHTML=Object.entries(tabs).map(([k,[name,icon]])=>'<button aria-label="'+name+'" aria-pressed="'+(k===tab)+'" data-view="'+k+'">'+svg(icon)+'</button>').join('');
  const panel=$('#primary-content');
  if(service==='todo'){
    panel.setAttribute('role','tabpanel');panel.setAttribute('aria-labelledby','tab-'+tab);
    const items=tasks.filter(x=>tab==='done'?x.done:!x.done&&x.bucket===tab);
    panel.innerHTML=card(tabs[tab][0],items.length+'件',items.map(x=>'<div class="row"><button class="check" aria-label="'+escapeText(x.name)+'：'+(x.done?'未完了に戻す':'完了にする')+'" aria-pressed="'+!!x.done+'" data-check="'+x.id+'"><span>'+(x.done?svg('check'):'')+'</span></button><span class="row-text"><span class="row-title">'+escapeText(x.name)+'</span><span class="caption">'+x.meta+'</span></span><span class="chip '+(x.done?'green':x.tone)+'">'+(x.done?'完了':x.badge)+'</span></div>').join('')||'<p class="empty">表示する項目はありません。</p>','todo','list-card');
  } else {
    panel.removeAttribute('role');panel.removeAttribute('aria-labelledby');
    panel.innerHTML=service==='calendar'?card('これからの予定','架空の予定',schedule.map(x=>row(...x)).join(''),'','list-card'):card('メモ一覧',notes.length+'件',notes.map(x=>row(x,'見本用のメモ')).join(''),'notes','list-card');
  }
  $('#secondary-content').innerHTML=service==='calendar'?card('予定の表示','', '<p class="notice">表示の確認用です。カレンダーとは連携していません。</p>'):card(service==='todo'?'今週の予定':'よく使う予定','',schedule.map(x=>row(...x)).join(''));
  $('#secondary-content').innerHTML+='<div class="card"><p class="notice"><strong>見本について</strong>項目はすべて架空です。入力内容は保存・送信されません。</p></div>';
}
function chooseService(k){if(!Object.hasOwn(services,k))return;service=k;put('service',k);render();window.scrollTo(0,0)}
function chooseTab(k,inBar=false){tab=k;put('todo-tab',k);render();(inBar?$('#screenbar')?.querySelector('[data-view="'+k+'"]'):$('#tab-'+k))?.focus();window.scrollTo(0,0)}
function setDrawer(value,restore=false){$('#side').classList.toggle('open',value);$('#scrim').classList.toggle('visible',value);$('#scrim').hidden=!value;$('#menu-button').setAttribute('aria-expanded',String(value));if(restore)$('#menu-button').focus();if(value)$('#services a').focus();}
function setQuick(value,restore=false){$('#quick-menu').hidden=!value;$('#quick').setAttribute('aria-expanded',String(value));if(restore)$('#quick').focus();if(value)$('#quick-menu button').focus();}
function openDialog(kind,trigger){
  const d=$('#dialog');d.dataset.kind=kind;d.returnFocus=trigger;
  if(kind==='settings'){$('#dialog-title').textContent='外観設定';$('#dialog-main').innerHTML='<p>ライトが標準です。右のボタンでダーク案と比較できます。</p>';$('#dialog-foot').innerHTML='<button type="button" class="secondary" id="toggle-theme">ダークに切替</button>';themeButton();} 
  else if(kind==='account'){$('#dialog-title').textContent='アカウント';$('#dialog-main').innerHTML='<p>これはログイン後の画面構成を確認するための見本です。Googleアカウントには接続しません。</p>';$('#dialog-foot').innerHTML='';}
  else{$('#dialog-title').textContent=services[kind][0]+'を追加';$('#dialog-main').innerHTML='<label for="draft-title">タイトル</label><input id="draft-title" maxlength="80" required placeholder="例：日用品を見直す">';$('#dialog-foot').innerHTML='<button type="submit" class="primary">見本に追加</button>';}
  d.showModal();(d.querySelector('input')||$('#dialog-close')).focus();
}
function themeButton(){const b=$('#toggle-theme');if(b)b.textContent=document.documentElement.dataset.theme==='dark'?'ライトに切替':'ダークに切替'}
function flash(message){const o=$('#toast');o.textContent=message;o.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{o.hidden=true},2200)}
document.addEventListener('click',e=>{const b=e.target.closest('button,a');if(!b){setQuick(false);return}const ds=b.dataset;
 if(ds.serviceLink){e.preventDefault();chooseService(ds.serviceLink);history.pushState(null,'','#'+ds.serviceLink);if($('#side').classList.contains('open')){setDrawer(false);$('#main').focus();}else $('#services [aria-current="page"]').focus();return}
 if(ds.view){chooseTab(ds.view,b.closest('#screenbar')!==null);return}
 if(ds.check){const task=tasks.find(t=>t.id===Number(ds.check));task.done=!task.done;render();$('#primary-content .check')?.focus();flash(task.done?'見本で完了にしました':'見本で未完了に戻しました');return}
 if(ds.create){const fromQuick=b.closest('#quick-menu');setQuick(false);openDialog(ds.create,fromQuick?$('#quick'):b);return}
 switch(b.id){case 'menu-button':setDrawer(b.getAttribute('aria-expanded')!=='true',b.getAttribute('aria-expanded')==='true');break;case 'scrim':setDrawer(false,true);break;case 'quick':setQuick(b.getAttribute('aria-expanded')!=='true',b.getAttribute('aria-expanded')==='true');break;case 'settings':case 'account':setQuick(false);openDialog(b.id,b);break;case 'dialog-close':$('#dialog').close();break;case 'toggle-theme':document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark';put('theme',document.documentElement.dataset.theme);themeButton();break;default:if(!b.closest('.quick'))setQuick(false)}
});
$('#dialog-form').addEventListener('submit',e=>{e.preventDefault();const kind=$('#dialog').dataset.kind,name=$('#draft-title')?.value.trim();if(!name)return;if(kind==='todo'){tasks.unshift({id:id++,name,meta:'見本の項目',badge:'未設定',tone:'',bucket:'inbox'});tab='inbox';put('todo-tab',tab)}else notes.unshift(name);$('#dialog').close();chooseService(kind);history.pushState(null,'','#'+kind);$('#main').focus();flash('見本に追加しました')});
$('#dialog').addEventListener('close',()=>$('#dialog').returnFocus?.focus());
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#dialog').open){if(!$('#quick-menu').hidden)setQuick(false,true);else if($('#side').classList.contains('open'))setDrawer(false,true)}if(e.target.closest('#tabs')&&['ArrowLeft','ArrowRight','Home','End'].includes(e.key)){e.preventDefault();const keys=Object.keys(tabs),i=keys.indexOf(tab);chooseTab(keys[e.key==='Home'?0:e.key==='End'?2:(i+(e.key==='ArrowRight'?1:2))%3])}});
addEventListener('hashchange',()=>chooseService(location.hash.slice(1)));matchMedia('(min-width:1024px)').addEventListener('change',()=>setDrawer(false));
