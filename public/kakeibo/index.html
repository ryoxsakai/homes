<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <title>家計 | Homes</title>
  <link rel="apple-touch-icon" sizes="600x600" href="/homes-icon.png">
  <link rel="manifest" href="/homes.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Homes">
  <script src="/shared/theme-init.js?v=1"></script>
  <link rel="stylesheet" href="/shared/header.css?v=navigation-2">
  <link rel="stylesheet" href="/shared/works-design.css?v=4">
  <link rel="stylesheet" href="/shared/works-dialogs.css?v=fb98327c">
  <link rel="stylesheet" href="/shared/homes-theme.css?v=menu-unified-2">
  <link rel="stylesheet" href="/shared/homes-app.css?v=menu-unified-1">
  <link rel="stylesheet" href="/kakeibo/kakeibo.css?v=1">
</head>
<body class="homes-page kakeibo-page">
  <header class="page-header works-header">
    <h1><a class="works-home" href="/" aria-label="Homes ホーム"><img class="page-header-icon homes-logo" src="/homes-icon.png" alt="" width="32" height="32"><span>Homes</span></a><span class="works-page-title">家計</span></h1>
    <div class="works-header-actions">
      <div id="user-bar" class="user-bar" hidden>
        <button id="sign-out" class="user-icon-btn" type="button" aria-label="ログアウト" title="ログアウト">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="9" r="3"/><path d="M5.5 18c1-3 3-4.5 6.5-4.5s5.5 1.5 6.5 4.5"/></svg>
        </button>
      </div>
    </div>
  </header>

  <p id="loading" class="homes-loading" role="status">読み込み中…</p>

  <main id="app-main" class="homes-main" hidden>
    <div class="homes-heading">
      <div>
        <h2>家計</h2>
        <p id="summary" class="homes-summary"></p>
      </div>
      <div class="homes-heading-actions">
        <button id="open-add" class="homes-btn homes-btn-primary" type="button">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          <span id="open-add-label">記録する</span>
        </button>
      </div>
    </div>

    <p id="save-status" class="homes-save-status" role="status" aria-live="polite"></p>

    <div class="kakeibo-month" id="month-bar" role="group" aria-label="表示する月">
      <button id="prev-month" class="homes-icon-btn" type="button" aria-label="前の月">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m15 6-6 6 6 6"/></svg>
      </button>
      <strong id="month-label" aria-live="polite"></strong>
      <button id="next-month" class="homes-icon-btn" type="button" aria-label="次の月">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>
      </button>
      <button id="this-month" class="homes-btn homes-btn-quiet" type="button">今月</button>
      <p id="month-total" class="kakeibo-month-total"></p>
    </div>

    <div class="kakeibo-tabs" role="tablist" aria-label="家計の区分">
      <button type="button" role="tab" data-tab="fixed"><span>固定費</span><small data-total="fixed"></small></button>
      <button type="button" role="tab" data-tab="eatout"><span>外食</span><small data-total="eatout"></small></button>
      <button type="button" role="tab" data-tab="home"><span>内食・中食</span><small data-total="home"></small></button>
      <button type="button" role="tab" data-tab="conbini"><span>コンビニ</span><small data-total="conbini"></small></button>
      <button type="button" role="tab" data-tab="living"><span>生活・雑貨</span><small data-total="living"></small></button>
    </div>

    <section id="panel" role="tabpanel" aria-labelledby="">
      <form id="add-form" class="homes-inline-form kakeibo-add" autocomplete="off">
        <label><span class="homes-sr-only" id="add-name-label">店名</span><input id="add-name" maxlength="100" list="name-options" enterkeyhint="next"></label>
        <label class="kakeibo-yen"><span class="homes-sr-only">金額（円）</span><input id="add-amount" inputmode="numeric" maxlength="14" placeholder="金額" enterkeyhint="done"></label>
        <label id="add-cycle-field"><span class="homes-sr-only">支払い</span>
          <select id="add-cycle"><option value="monthly">毎月</option><option value="bimonthly">隔月</option><option value="yearly">年払い</option></select>
        </label>
        <button class="homes-btn homes-btn-primary" type="submit">追加</button>
        <datalist id="name-options"></datalist>
      </form>
      <p id="tab-note" class="kakeibo-note"></p>
      <ul id="list" class="homes-panel"></ul>
      <div id="empty" class="homes-empty" hidden><p id="empty-text"></p></div>
    </section>

    <nav class="homes-bottom-menu" aria-label="家計メニュー">
      <button id="menu-list" type="button" aria-current="page" aria-label="一覧の先頭へ" title="一覧の先頭へ">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg>
      </button>
      <button id="menu-month" type="button" aria-label="今月を表示" title="今月を表示">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>
      </button>
      <button id="menu-add" class="homes-menu-add" type="button" aria-label="記録する" title="記録する">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </nav>
  </main>

  <!-- 支出・固定費の編集 -->
  <dialog id="item-dialog" class="homes-dialog" aria-labelledby="item-title">
    <form id="item-form" method="dialog" novalidate>
      <div class="homes-dialog-head">
        <h3 id="item-title">支出</h3>
        <button class="homes-icon-btn" type="button" data-close aria-label="閉じる">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <div class="homes-dialog-body">
        <label class="homes-field" data-for="entry"><span>区分</span>
          <select name="kind">
            <option value="eatout">外食</option><option value="home">内食・中食</option>
            <option value="conbini">コンビニ</option><option value="living">生活・雑貨</option>
          </select>
        </label>
        <label class="homes-field"><span id="name-label">店名</span><input name="name" maxlength="100" list="name-options"></label>
        <div class="homes-field-row">
          <label class="homes-field"><span>金額（円）</span><input name="amount" inputmode="numeric" maxlength="14"></label>
          <label class="homes-field" data-for="entry"><span>日付</span><input name="date" type="date"></label>
          <label class="homes-field" data-for="fixed"><span>支払い</span>
            <select name="cycle"><option value="monthly">毎月</option><option value="bimonthly">隔月</option><option value="yearly">年払い</option></select>
          </label>
        </div>
        <label class="homes-field"><span>メモ</span><input name="memo" maxlength="200" placeholder="任意"></label>
        <p id="item-meta" class="homes-meta"></p>
      </div>
      <div class="homes-dialog-foot">
        <button id="delete-item" class="homes-btn homes-btn-danger" type="button">削除</button>
        <span class="homes-spacer"></span>
        <button class="homes-btn" type="button" data-close>キャンセル</button>
        <button class="homes-btn homes-btn-primary" type="submit">保存</button>
      </div>
    </form>
  </dialog>

  <div id="toast" class="homes-toast" role="status" aria-live="polite" hidden></div>

  <script type="module" src="/shared/service-entry.mjs?v=7" data-service-app="/kakeibo/app.mjs?v=2"></script>
</body>
</html>
