<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <title>食料品 | Homes</title>
  <link rel="apple-touch-icon" sizes="600x600" href="/homes-icon.png">
  <link rel="manifest" href="/homes.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Homes">
  <script src="/shared/theme-init.js?v=1"></script>
  <link rel="stylesheet" href="/shared/header.css?v=navigation-2">
  <link rel="stylesheet" href="/shared/works-design.css?v=4">
  <link rel="stylesheet" href="/shared/works-dialogs.css?v=fb98327c">
  <link rel="stylesheet" href="/shared/homes-theme.css?v=1">
  <link rel="stylesheet" href="/shared/homes-app.css?v=1">
</head>
<body class="homes-page grocery-page">
  <header class="page-header works-header">
    <h1><a class="works-home" href="/" aria-label="Homes ホーム"><img class="page-header-icon homes-logo" src="/homes-icon.png" alt="" width="32" height="32"><span>Homes</span></a><span class="works-page-title">食料品</span></h1>
    <div class="works-header-actions">
      <div id="user-bar" class="user-bar" hidden>
        <button id="sign-out" class="user-icon-btn" type="button" aria-label="ログアウト" title="ログアウト">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="9" r="3"/><path d="M5.5 18c1-3 3-4.5 6.5-4.5s5.5 1.5 6.5 4.5"/></svg>
        </button>
      </div>
    </div>
  </header>

  <p id="loading" class="homes-loading" role="status">読み込み中…</p>

  <main id="app-main" class="homes-main" hidden>
    <div class="homes-heading">
      <div>
        <h2>食料品</h2>
        <p id="summary" class="homes-summary"></p>
      </div>
      <div class="homes-heading-actions">
        <button id="open-categories" class="homes-btn" type="button" aria-haspopup="dialog">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg>
          <span>カテゴリ</span>
        </button>
        <button id="open-add" class="homes-btn homes-btn-primary" type="button">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          <span>買うものを追加</span>
        </button>
      </div>
    </div>

    <p id="save-status" class="homes-save-status" role="status" aria-live="polite"></p>

    <section class="homes-toolbar" aria-label="食料品の表示">
      <div class="homes-segment" role="group" aria-label="リスト">
        <button type="button" data-view="tobuy" aria-pressed="true">買うもの<span id="count-tobuy" class="homes-count">0</span></button>
        <button type="button" data-view="bought" aria-pressed="false">買ったもの<span id="count-bought" class="homes-count">0</span></button>
      </div>
      <div class="homes-toolbar-end">
        <label><span class="homes-sr-only">カテゴリで絞り込み</span><select id="filter-category"></select></label>
        <label data-for="bought"><span class="homes-sr-only">並べ替え</span>
          <select id="sort">
            <option value="expiry">期限が近い順</option>
            <option value="bought-desc">購入日が新しい順</option>
            <option value="name">品名順</option>
          </select>
        </label>
      </div>
    </section>

    <!-- 買うもの -->
    <section id="view-tobuy" aria-label="買うもの">
      <form id="add-form" class="homes-inline-form" autocomplete="off">
        <label><span class="homes-sr-only">品名</span><input id="add-name" maxlength="200" placeholder="買うもの（例：牛乳）" enterkeyhint="done"></label>
        <label><span class="homes-sr-only">カテゴリ</span><select id="add-category"></select></label>
        <button class="homes-btn homes-btn-primary" type="submit">追加</button>
      </form>
      <div id="tobuy-list"></div>
      <div id="tobuy-empty" class="homes-empty" hidden><p>買うものはありません</p></div>
    </section>

    <!-- 買ったもの -->
    <section id="view-bought" aria-label="買ったもの" hidden>
      <ul id="bought-list" class="homes-panel"></ul>
      <div id="bought-empty" class="homes-empty" hidden><p>買ったものはまだありません。買うものの ◯ を押すとここに移ります。</p></div>
    </section>

    <nav class="homes-bottom-menu" aria-label="食料品メニュー">
      <button id="menu-list" type="button" aria-current="page" aria-label="一覧の先頭へ" title="一覧の先頭へ">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg>
      </button>
      <button id="menu-categories" type="button" aria-haspopup="dialog" aria-label="カテゴリ" title="カテゴリ">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg>
      </button>
      <button id="menu-add" class="homes-menu-add" type="button" aria-label="買うものを追加" title="買うものを追加">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </nav>
  </main>

  <!-- 品目の編集 -->
  <dialog id="item-dialog" class="homes-dialog" aria-labelledby="item-title">
    <form id="item-form" method="dialog" novalidate>
      <div class="homes-dialog-head">
        <h3 id="item-title">買うもの</h3>
        <button class="homes-icon-btn" type="button" data-close aria-label="閉じる">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <div class="homes-dialog-body">
        <label class="homes-field"><span>品名<em>必須</em></span><input name="name" required maxlength="200"></label>
        <label class="homes-field"><span>カテゴリ</span><select name="category"></select></label>
        <div id="bought-fields" class="homes-field-group">
          <label class="homes-field"><span>購入日</span><input name="purchasedDate" type="date" required></label>
          <div class="homes-field">
            <span id="expiry-label">賞味期限</span>
            <div class="homes-field-inline">
              <input name="expiryDate" type="date" aria-labelledby="expiry-label">
              <button id="clear-expiry" class="homes-btn homes-btn-quiet" type="button">なし</button>
            </div>
            <div class="homes-presets" role="group" aria-label="購入日からの日数で設定">
              <button type="button" data-days="3">3日</button>
              <button type="button" data-days="7">1週間</button>
              <button type="button" data-days="14">2週間</button>
              <button type="button" data-days="30">1か月</button>
            </div>
          </div>
        </div>
        <p id="item-meta" class="homes-meta"></p>
      </div>
      <div class="homes-dialog-foot">
        <button id="delete-item" class="homes-btn homes-btn-danger" type="button">削除</button>
        <button id="buy-again" class="homes-btn homes-btn-quiet" type="button">もう一度買う</button>
        <span class="homes-spacer"></span>
        <button class="homes-btn" type="button" data-close>キャンセル</button>
        <button class="homes-btn homes-btn-primary" type="submit">保存</button>
      </div>
    </form>
  </dialog>

  <!-- カテゴリ -->
  <dialog id="category-dialog" class="homes-dialog" aria-labelledby="category-title">
    <div class="homes-dialog-head">
      <h3 id="category-title">カテゴリ</h3>
      <button class="homes-icon-btn" type="button" data-close aria-label="閉じる">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="homes-dialog-body">
      <section class="homes-manage">
        <ul class="homes-manage-list"></ul>
        <form class="homes-manage-add"><input maxlength="50" placeholder="新しいカテゴリ（例：冷凍食品）" aria-label="新しいカテゴリ"><button class="homes-btn" type="submit">追加</button></form>
      </section>
      <p class="homes-hint">買うものはこの順番で並びます。お店を回る順にしておくと便利です。名前を変えると登録済みの品目にも反映されます。</p>
    </div>
  </dialog>

  <div id="toast" class="homes-toast" role="status" aria-live="polite" hidden></div>

  <script type="module" src="/shared/service-entry.mjs?v=6" data-service-app="/grocery/app.mjs?v=1"></script>
</body>
</html>
