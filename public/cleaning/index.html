<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
  <title>掃除 | Homes</title>
  <link rel="apple-touch-icon" sizes="600x600" href="/homes-icon.png">
  <link rel="manifest" href="/homes.webmanifest">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Homes">
  <script src="/shared/theme-init.js?v=1"></script>
  <link rel="stylesheet" href="/shared/header.css?v=navigation-2">
  <link rel="stylesheet" href="/shared/works-design.css?v=4">
  <link rel="stylesheet" href="/shared/works-dialogs.css?v=fb98327c">
  <link rel="stylesheet" href="/shared/homes-theme.css?v=menu-unified-1">
  <link rel="stylesheet" href="/shared/homes-app.css?v=cleaning-date-fit-1">
</head>
<body class="homes-page cleaning-page">
  <header class="page-header works-header">
    <h1><a class="works-home" href="/" aria-label="Homes ホーム"><img class="page-header-icon homes-logo" src="/homes-icon.png" alt="" width="32" height="32"><span>Homes</span></a><span class="works-page-title">掃除</span></h1>
    <div class="works-header-actions">
      <button id="open-categories" type="button" aria-haspopup="dialog" aria-label="カテゴリ設定" title="カテゴリ設定" hidden aria-controls="category-dialog">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10.325 4.317a1.724 1.724 0 0 1 3.35 0 1.724 1.724 0 0 0 2.573 1.066 1.724 1.724 0 0 1 2.369 2.37 1.724 1.724 0 0 0 1.065 2.572 1.724 1.724 0 0 1 0 3.35 1.724 1.724 0 0 0-1.065 2.573 1.724 1.724 0 0 1-2.37 2.369 1.724 1.724 0 0 0-2.572 1.065 1.724 1.724 0 0 1-3.35 0 1.724 1.724 0 0 0-2.573-1.065 1.724 1.724 0 0 1-2.369-2.37 1.724 1.724 0 0 0-1.065-2.572 1.724 1.724 0 0 1 0-3.35 1.724 1.724 0 0 0 1.065-2.573 1.724 1.724 0 0 1 2.37-2.369 1.724 1.724 0 0 0 2.572-1.065"/><circle cx="12" cy="12" r="3"/></svg>
      </button>
      <div id="user-bar" class="user-bar" hidden>
        <button id="sign-out" class="user-icon-btn" type="button" aria-label="ログアウト" title="ログアウト">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="9" r="3"/><path d="M5.5 18c1-3 3-4.5 6.5-4.5s5.5 1.5 6.5 4.5"/></svg>
        </button>
      </div>
    </div>
  </header>

  <p id="loading" class="homes-loading" role="status">読み込み中…</p>

  <main id="app-main" class="homes-main" hidden>
    <div class="homes-heading">
      <div>
        <h2>掃除</h2>
        <p id="summary" class="homes-summary"></p>
      </div>
      <div class="homes-heading-actions">
        <button id="open-add" class="homes-btn homes-btn-primary" type="button" aria-haspopup="dialog">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
          <span>掃除場所を追加</span>
        </button>
      </div>
    </div>

    <p id="save-status" class="homes-save-status" role="status" aria-live="polite"></p>

    <section class="homes-toolbar" aria-label="掃除の表示">
      <div class="homes-segment" role="group" aria-label="表示する場所">
        <button type="button" data-show="all" aria-pressed="true">すべて<span id="count-all" class="homes-count">0</span></button>
        <button type="button" data-show="due" aria-pressed="false">今日まで<span id="count-due" class="homes-count">0</span></button>
      </div>
      <div class="homes-toolbar-end">
        <label><span class="homes-sr-only">カテゴリで絞り込み</span><select id="filter-category"></select></label>
        <label><span class="homes-sr-only">並べ替え</span>
          <select id="sort">
            <option value="due">期限が近い順</option>
            <option value="due-desc">期限が遠い順</option>
            <option value="place">場所の名前順</option>
          </select>
        </label>
      </div>
    </section>

    <ul id="item-list" class="homes-panel"></ul>
    <div class="homes-list-foot"><button id="complete-all" class="homes-btn homes-btn-quiet" type="button">表示中の場所をすべて完了</button></div>
    <div id="empty" class="homes-empty" hidden>
      <p id="empty-text"></p>
      <div class="homes-empty-actions">
        <button id="empty-add" class="homes-btn homes-btn-primary" type="button">掃除場所を追加</button>
        <button id="import-legacy" class="homes-btn" type="button" hidden>以前の掃除チェッカーから取り込む</button>
      </div>
    </div>

    <nav class="homes-bottom-menu" aria-label="掃除メニュー">
      <button id="menu-list" type="button" aria-current="page" aria-label="一覧の先頭へ" title="一覧の先頭へ">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M9 6h11M9 12h11M9 18h11M4 6h.01M4 12h.01M4 18h.01"/></svg>
      </button>
      <button id="menu-add" class="homes-menu-add" type="button" aria-haspopup="dialog" aria-label="掃除場所を追加" title="掃除場所を追加">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
      </button>
    </nav>
  </main>

  <!-- 掃除場所の追加・編集 -->
  <dialog id="item-dialog" class="homes-dialog" aria-labelledby="item-title">
    <form id="item-form" method="dialog" novalidate>
      <div class="homes-dialog-head">
        <h3 id="item-title">掃除場所</h3>
        <button class="homes-icon-btn" type="button" data-close aria-label="閉じる">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
        </button>
      </div>
      <div class="homes-dialog-body">
        <label class="homes-field"><span>場所<em>必須</em></span><input name="place" required maxlength="100" placeholder="例：シンク"></label>
        <label class="homes-field"><span>カテゴリ</span><select name="category"></select></label>
        <div class="homes-field">
          <span id="frequency-label">頻度（日ごと）</span>
          <div class="homes-stepper" role="group" aria-labelledby="frequency-label">
            <button type="button" data-step="-1" aria-label="1日減らす">−</button>
            <input name="frequency" type="number" inputmode="numeric" min="1" max="365" required aria-labelledby="frequency-label">
            <button type="button" data-step="1" aria-label="1日増やす">＋</button>
          </div>
          <div class="homes-presets" role="group" aria-label="よく使う頻度">
            <button type="button" data-frequency="1">毎日</button>
            <button type="button" data-frequency="3">3日</button>
            <button type="button" data-frequency="7">1週間</button>
            <button type="button" data-frequency="14">2週間</button>
            <button type="button" data-frequency="30">1か月</button>
          </div>
        </div>
        <label class="homes-field"><span>最後に掃除した日</span><input name="lastCleaned" type="date" required></label>
        <p id="item-meta" class="homes-meta"></p>
      </div>
      <div class="homes-dialog-foot">
        <button id="delete-item" class="homes-btn homes-btn-danger" type="button">削除</button>
        <span class="homes-spacer"></span>
        <button class="homes-btn" type="button" data-close>キャンセル</button>
        <button id="save-item" class="homes-btn homes-btn-primary" type="submit">保存</button>
      </div>
    </form>
  </dialog>

  <!-- 掃除の設定 -->
  <dialog id="category-dialog" class="homes-dialog" aria-labelledby="category-title">
    <div class="homes-dialog-head">
      <h3 id="category-title">カテゴリ設定</h3>
      <button class="homes-icon-btn" type="button" data-close aria-label="閉じる">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <div class="homes-dialog-body">
      <section class="homes-manage" aria-labelledby="category-section-title">
        <h4 id="category-section-title">カテゴリ管理</h4>
        <ul class="homes-manage-list"></ul>
        <form class="homes-manage-add"><input maxlength="50" placeholder="新しいカテゴリ（例：ベランダ）" aria-label="新しいカテゴリ"><button class="homes-btn" type="submit">追加</button></form>
      </section>
      <p class="homes-hint">カテゴリを追加・並べ替え・編集できます。名前を変えると登録済みの場所にも反映されます。</p>
    </div>
  </dialog>

  <div id="toast" class="homes-toast" role="status" aria-live="polite" hidden></div>

  <script type="module" src="/shared/service-entry.mjs?v=6" data-service-app="/cleaning/app.mjs?v=2"></script>
</body>
</html>
